[package]
name = "rotating-ipv6-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Authenticated HTTP CONNECT proxy with rotating IPv6 egress"
license = "GPL-3.0-only"

[dependencies]
base64 = "0.22.1"
ipnet = "2.12.0"
rand = "0.9.5"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
lto = "thin"
strip = true
